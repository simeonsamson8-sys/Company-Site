<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skilful Technology | Laptops & Accessories</title>

    <meta name="description"
          content="Shop laptops and accessories with Skilful Technology.
          Contact us for available laptops, competitive prices and nationwide delivery across Nigeria.">

    <meta name="theme-color" content="#071426">

    <style>
        /* =========================
           GENERAL STYLING
        ========================= */

        :root {
            --navy: #071426;
            --blue: #087cff;
            --light-blue: #eaf3ff;
            --white: #ffffff;
            --text: #202938;
            --muted: #697586;
            --background: #f5f7fb;
            --border: #e3e8f0;
            --green: #20bf6b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            background: var(--white);
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        img {
            display: block;
            width: 100%;
        }

        .container {
            width: min(1150px, 92%);
            margin: auto;
        }

        .section {
            padding: 75px 0;
        }

        .section-title {
            font-size: clamp(26px, 4vw, 38px);
            font-weight: 800;
            color: var(--navy);
            margin-bottom: 10px;
        }

        .section-description {
            color: var(--muted);
            max-width: 600px;
            margin-bottom: 35px;
        }

        .blue {
            color: var(--blue);
        }

        /* =========================
           TOP BAR
        ========================= */

        .top-bar {
            background: var(--blue);
            color: var(--white);
            text-align: center;
            padding: 9px 12px;
            font-size: 13px;
            font-weight: 600;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: var(--navy);
            color: var(--white);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #1b2a40;
        }

        .navbar {
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 21px;
            font-weight: 900;
            letter-spacing: -0.7px;
            white-space: nowrap;
        }

        .logo span {
            color: #3d9cff;
        }

        .logo small {
            display: block;
            font-size: 9px;
            letter-spacing: 2px;
            color: #c7d6e9;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            color: #e0e9f5;
            font-size: 14px;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: #52a5ff;
        }

        .menu-button {
            display: none;
            color: white;
            background: transparent;
            border: 1px solid #42516a;
            border-radius: 8px;
            padding: 7px 11px;
            font-size: 20px;
        }

        /* =========================
           BUTTONS
        ========================= */

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            border-radius: 8px;
            padding: 13px 20px;
            font-weight: 800;
            font-size: 14px;
            transition: 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: var(--blue);
            color: white;
        }

        .btn-primary:hover {
            background: #0067dc;
        }

        .btn-outline {
            border: 1px solid #cbd5e1;
            color: var(--navy);
            background: white;
        }

        .btn-whatsapp {
            background: var(--green);
            color: white;
        }

        /* =========================
           HERO SECTION
        ========================= */

        .hero {
            background:
                radial-gradient(
                    circle at 85% 20%,
                    #173b65 0,
                    transparent 38%
                ),
                var(--navy);
            color: white;
            padding: 85px 0;
            overflow: hidden;
        }

        .hero-content {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            align-items: center;
            gap: 45px;
        }

        .hero-label {
            display: inline-block;
            background: #102d4c;
            color: #78b9ff;
            padding: 8px 13px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(38px, 5.5vw, 65px);
            line-height: 1.08;
            letter-spacing: -2px;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #45a1ff;
        }

        .hero p {
            color: #c4d0df;
            font-size: 17px;
            max-width: 520px;
            margin-bottom: 25px;
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .hero .btn-outline {
            background: transparent;
            border-color: #52647d;
            color: white;
        }

        .hero-image {
            border: 1px solid #29425f;
            border-radius: 20px;
            padding: 12px;
            background: #10243c;
            box-shadow: 0 25px 70px #0005;
        }

        .hero-image img {
            height: 330px;
            object-fit: cover;
            border-radius: 13px;
        }

        .hero-note {
            color: #dcecff;
            font-size: 12px;
            padding: 12px 4px 2px;
        }

        /* =========================
           BENEFITS
        ========================= */

        .benefits {
            background: white;
            border-bottom: 1px solid var(--border);
        }

        .benefit-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 25px 0;
        }

        .benefit {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .benefit-icon {
            min-width: 45px;
            height: 45px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: var(--light-blue);
            font-size: 22px;
        }

        .benefit strong {
            display: block;
            color: var(--navy);
            font-size: 14px;
        }

        .benefit small {
            color: var(--muted);
            font-size: 12px;
        }

        /* =========================
           PRODUCT SECTION
        ========================= */

        .products-section {
            background: var(--background);
        }

        .product-tools {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
        }

        .search-input {
            flex: 1;
            min-width: 220px;
            padding: 13px 15px;
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;
            background: white;
        }

        .search-input:focus {
            border-color: var(--blue);
        }

        .category-select {
            min-width: 175px;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: white;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .product-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            transition: 0.25s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px #07142612;
        }

        .product-image {
            height: 215px;
            background: #eaf0f8;
            overflow: hidden;
        }

        .product-image img {
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 20px;
        }

        .product-tag {
            display: inline-block;
            color: #075bc4;
            background: #eaf3ff;
            padding: 5px 9px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .product-info h3 {
            font-size: 19px;
            color: var(--navy);
            margin-bottom: 7px;
        }

        .product-info p {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 15px;
        }

        .product-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }

        .product-price {
            color: var(--navy);
            font-size: 13px;
            font-weight: 800;
        }

        .product-bottom .btn {
            padding: 10px 12px;
            font-size: 12px;
        }

        .no-products {
            grid-column: 1 / -1;
            color: var(--muted);
            padding: 35px;
            text-align: center;
            background: white;
            border-radius: 12px;
        }

        .catalog-note {
            margin-top: 22px;
            color: var(--muted);
            font-size: 12px;
        }

        /* =========================
           ABOUT SECTION
        ========================= */

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 50px;
        }

        .about-image img {
            height: 350px;
            object-fit: cover;
            border-radius: 15px;
        }

        .about-text p {
            color: var(--muted);
            margin: 15px 0;
        }

        .check-list {
            list-style: none;
            margin: 20px 0 25px;
        }

        .check-list li {
            padding: 7px 0;
            font-weight: 600;
            font-size: 14px;
        }

        .check-list li::before {
            content: "✓";
            color: var(--blue);
            font-weight: 900;
            margin-right: 10px;
        }

        /* =========================
           SERVICES
        ========================= */

        .services-section {
            background: var(--background);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .service-card {
            background: white;
            border: 1px solid var(--border);
            padding: 25px 20px;
            border-radius: 13px;
        }

        .service-card .icon {
            font-size: 30px;
            margin-bottom: 14px;
        }

        .service-card h3 {
            color: var(--navy);
            font-size: 17px;
            margin-bottom: 9px;
        }

        .service-card p {
            color: var(--muted);
            font-size: 13px;
        }

        /* =========================
           DELIVERY BANNER
        ========================= */

        .delivery-banner {
            background: var(--navy);
            color: white;
            padding: 55px 0;
        }

        .delivery-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
        }

        .delivery-content h2 {
            font-size: clamp(27px, 4vw, 40px);
            margin-bottom: 10px;
        }

        .delivery-content p {
            color: #c4d0df;
            max-width: 650px;
        }

        /* =========================
           CONTACT
        ========================= */

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
        }

        .contact-card {
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 28px;
            background: white;
        }

        .contact-card h3 {
            color: var(--navy);
            margin-bottom: 12px;
        }

        .contact-card p {
            color: var(--muted);
            margin-bottom: 15px;
        }

        .contact-number {
            display: block;
            padding: 10px 0;
            font-weight: 800;
            color: var(--navy);
        }

        .contact-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            background: #040c18;
            color: white;
            padding: 35px 0 20px;
        }

        .footer-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            padding-bottom: 25px;
        }

        .footer-top p {
            color: #a9b8ca;
            font-size: 13px;
            margin-top: 7px;
        }

        .footer-bottom {
            border-top: 1px solid #203047;
            padding-top: 20px;
            color: #9eacbe;
            font-size: 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 12px;
        }

        /* =========================
           FLOATING WHATSAPP BUTTON
        ========================= */

        .floating-whatsapp {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 999;
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--green);
            color: white;
            font-size: 27px;
            box-shadow: 0 6px 20px #0003;
        }

        /* =========================
           MOBILE RESPONSIVENESS
        ========================= */

        @media (max-width: 850px) {
            .hero-content {
                grid-template-columns: 1fr;
            }

            .hero-image {
                max-width: 600px;
            }

            .benefit-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .services-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .about-grid {
                grid-template-columns: 1fr;
            }

            .contact-grid {
                grid-template-columns: 1fr;
            }

            .delivery-content {
                align-items: flex-start;
                flex-direction: column;
            }
        }

        @media (max-width: 600px) {
            .navbar {
                min-height: 67px;
            }

            .logo {
                font-size: 17px;
            }

            .menu-button {
                display: block;
            }

            .nav-links {
                display: none;
                position: absolute;
                top: 67px;
                left: 0;
                width: 100%;
                background: var(--navy);
                padding: 20px 5%;
                flex-direction: column;
                align-items: flex-start;
                gap: 18px;
                border-top: 1px solid #24364e;
            }

            .nav-links.active {
                display: flex;
            }

            .hero {
                padding: 55px 0;
            }

            .hero h1 {
                font-size: 42px;
            }

            .hero p {
                font-size: 15px;
            }

            .hero-image img {
                height: 235px;
            }

            .benefit-grid {
                gap: 18px 10px;
            }

            .benefit {
                align-items: flex-start;
            }

            .benefit-icon {
                min-width: 38px;
                height: 38px;
                font-size: 18px;
            }

            .benefit strong {
                font-size: 12px;
            }

            .benefit small {
                font-size: 11px;
            }

            .section {
                padding: 52px 0;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }

            .product-image {
                height: 235px;
            }

            .services-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .service-card {
                padding: 18px 14px;
            }

            .service-card h3 {
                font-size: 15px;
            }

            .service-card p {
                font-size: 12px;
            }

            .about-image img {
                height: 250px;
            }

            .contact-card {
                padding: 20px;
            }

            .footer-bottom {
                flex-direction: column;
            }
        }
    </style>
</head>
